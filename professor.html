<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio 27 de Março - Área do Professor</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Estilos anteriores mantidos */
    .notification-badge {
      background: #e74c3c;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 0.7rem;
      margin-left: 5px;
    }

    .rejection-notice {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      color: #721c24;
    }

    .rejection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .rejection-title {
      font-weight: 600;
      color: #721c24;
    }

    .rejection-date {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .rejection-observation {
      font-style: italic;
      margin-top: 10px;
      padding-left: 15px;
      border-left: 3px solid #e74c3c;
    }
  </style>
</head>
<body>
  <!-- Estrutura HTML anterior mantida -->

  <script>
    // VARIÁVEIS GLOBAIS ADICIONAIS
    let rejectedGrades = [];

    // NOVA FUNÇÃO PARA CARREGAR NOTIFICAÇÕES DE REJEIÇÃO
    async function loadRejectionNotifications() {
      try {
        // Buscar notas rejeitadas do professor atual
        const { data, error } = await supabase
          .from('grades')
          .select('*')
          .eq('teacher_id', currentUser.id)
          .eq('status', 'rejected');

        if (error) throw error;
        
        rejectedGrades = data || [];
        updateNotificationBadge();
        
      } catch (error) {
        console.error('Erro ao carregar notificações:', error);
      }
    }

    // FUNÇÃO PARA ATUALIZAR BADGE DE NOTIFICAÇÕES
    function updateNotificationBadge() {
      const notificationElements = document.querySelectorAll('.notification-badge');
      notificationElements.forEach(element => {
        element.textContent = rejectedGrades.length;
        element.style.display = rejectedGrades.length > 0 ? 'inline-block' : 'none';
      });
    }

    // NOVA TAB PARA NOTIFICAÇÕES DE REJEIÇÃO
    function loadRejectionsTab() {
      let rejectionsHTML = '';

      if (rejectedGrades.length === 0) {
        rejectionsHTML = `
          <div class="empty-state">
            <h3>✅ Nenhuma rejeição</h3>
            <p>Suas notas estão todas aprovadas pelo pedagógico.</p>
          </div>
        `;
      } else {
        rejectionsHTML = `
          <div class="alert alert-warning">
            <strong>⚠️ Atenção:</strong> Você tem ${rejectedGrades.length} nota(s) rejeitada(s) que precisam de correção.
          </div>
        `;

        rejectedGrades.forEach(grade => {
          const student = students.find(s => s.id === grade.student_id);
          const discipline = disciplines.find(d => d.id === grade.discipline_id);
          
          rejectionsHTML += `
            <div class="rejection-notice">
              <div class="rejection-header">
                <div class="rejection-title">
                  ❌ Nota Rejeitada - ${student ? student.name : 'Aluno não encontrado'}
                </div>
                <div class="rejection-date">
                  ${new Date(grade.rejected_at).toLocaleDateString('pt-BR')}
                </div>
              </div>
              
              <div class="rejection-details">
                <p><strong>Disciplina:</strong> ${discipline ? discipline.name : 'N/A'}</p>
                <p><strong>Nota Enviada:</strong> ${grade.grade}</p>
                <p><strong>Tipo de Avaliação:</strong> ${grade.grade_type.toUpperCase()}</p>
              </div>

              <div class="rejection-observation">
                <strong>Observação do Pedagógico:</strong><br>
                ${grade.rejection_observation || 'Nenhuma observação fornecida.'}
              </div>

              <div style="margin-top: 15px;">
                <button class="btn btn-warning" onclick="reSubmitGrade(${grade.id})">
                  ✏️ Corrigir e Reenviar
                </button>
                <button class="btn" onclick="viewGradeDetails(${grade.id})">
                  👀 Ver Detalhes
                </button>
              </div>
            </div>
          `;
        });
      }

      document.getElementById('rejections-content').innerHTML = rejectionsHTML;
    }

    // FUNÇÃO PARA REENVIAR NOTA CORRIGIDA
    async function reSubmitGrade(gradeId) {
      const grade = rejectedGrades.find(g => g.id === gradeId);
      if (!grade) return;

      const newGrade = prompt(`Corrigir nota para ${grade.grade}:`, grade.grade);
      if (!newGrade || isNaN(newGrade)) {
        showAlert('Nota inválida!', 'warning');
        return;
      }

      try {
        const { error } = await supabase
          .from('grades')
          .update({
            grade: parseFloat(newGrade),
            status: 'pending',
            rejection_observation: null,
            rejected_by: null,
            rejected_at: null,
            resubmitted_at: new Date().toISOString()
          })
          .eq('id', gradeId);

        if (error) throw error;

        showAlert('✅ Nota corrigida e reenviada para aprovação!', 'success');
        await loadData(); // Recarregar dados
        
      } catch (error) {
        console.error('Erro ao reenviar nota:', error);
        showAlert('Erro ao reenviar nota', 'danger');
      }
    }

    // MODIFICAR A FUNÇÃO loadData PARA INCLUIR NOTIFICAÇÕES
    async function loadData() {
      try {
        // ... código anterior mantido

        // Carregar notificações de rejeição
        await loadRejectionNotifications();

        // Atualizar interface
        updateUserInfo();
        loadTabContent('dashboard');

      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        showAlert('Erro ao carregar dados do sistema', 'warning');
      }
    }

    // ADICIONAR BADGE NAS TABS
    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          
          tab.classList.add('active');
          const tabId = tab.dataset.tab;
          document.getElementById(`${tabId}-tab`).classList.add('active');
          
          loadTabContent(tabId);
        });
      });

      // Adicionar badge na tab de notificações
      const rejectionsTab = document.querySelector('[data-tab="rejections"]');
      if (rejectionsTab) {
        rejectionsTab.innerHTML = `Notificações <span class="notification-badge" style="display: none;">0</span>`;
      }
    }
  </script>
</body>
</html>
